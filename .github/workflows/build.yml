name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: solarius-windows-x86_64
            preset: Windows Desktop
            gdext_lib: libaimtrainer.windows.template_release.x86_64.dll
          - os: windows-latest
            artifact: solarius-windows-x86_32
            preset: Windows Desktop 32-bit
            gdext_lib: libaimtrainer.windows.template_release.x86_32.dll
          - os: ubuntu-latest
            artifact: solarius-linux-x86_64
            preset: Linux/X11
            gdext_lib: libaimtrainer.linux.template_release.x86_64.so
          - os: macos-latest
            artifact: solarius-macos-x86_64
            preset: macOS
            gdext_lib: libaimtrainer.macos.template_release.dylib

    defaults:
      run:
        shell: bash

    env:
      GODOT_VERSION: "4.3"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        shell: bash
        run: python -m pip install scons

      - name: Install Godot 4.3 export templates
        shell: bash
        run: |
          set -euo pipefail
          tdz="$RUNNER_TEMP/godot-templates"
          if [ ! -d "$tdz/templates" ]; then
            curl -fsSL -o "$RUNNER_TEMP/templates.tpz" \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q "$RUNNER_TEMP/templates.tpz" -d "$tdz"
          fi
          python tools/install_templates.py "$tdz" "$GODOT_VERSION"

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          use-mono: false

      - name: Build 32-bit GDExtension library
        if: matrix.artifact == 'solarius-windows-x86_32'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: mingw-w64-i686-gcc

      - name: Compile 32-bit library
        if: matrix.artifact == 'solarius-windows-x86_32'
        shell: bash
        run: |
          set -euo pipefail
          # The runner image ships its own 64-bit MinGW at C:\mingw64 and it wins
          # over msys2's toolchain on PATH, so SCons gets pointed straight at the
          # i686 binaries. The default g++ staying x86_64 is the whole reason for
          # the override, so verify the compiler SCons will actually call.
          i686_gxx=/c/msys64/mingw32/bin/g++.exe
          {
            echo "i686_gxx=$i686_gxx"
            ls -l "$i686_gxx" || true
            "$i686_gxx" -dumpmachine || true
          } 2>&1
          test -x "$i686_gxx"
          test "$("$i686_gxx" -dumpmachine)" = "i686-w64-mingw32"
          scons platform=windows target=template_release arch=x86_32 use_mingw=yes \
            CC=/c/msys64/mingw32/bin/gcc.exe \
            CXX="$i686_gxx" \
            LINK="$i686_gxx" \
            -j4 2>&1 | tail -40
          test -f "bin/${{ matrix.gdext_lib }}"

      - name: Build GDExtension library
        if: matrix.artifact != 'solarius-windows-x86_32'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.artifact }}" in
            solarius-windows-x86_64) scons platform=windows target=template_release use_mingw=yes -j4 ;;
            solarius-linux-x86_64)   scons platform=linux   target=template_release arch=x86_64 -j4 ;;
            solarius-macos-x86_64)   scons platform=macos   target=template_release arch=x86_64 -j4 ;;
            *) echo "unknown artifact ${{ matrix.artifact }}"; exit 1 ;;
          esac
          test -f "bin/${{ matrix.gdext_lib }}" || { echo "missing GDExtension library bin/${{ matrix.gdext_lib }}"; exit 1; }

      - name: Export standalone build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-release "${{ matrix.preset }}" "build/${{ matrix.artifact }}"
          ls -la build/

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          python tools/package_build.py \
            "${{ runner.os }}" "${{ matrix.artifact }}" build dist
          ls -la dist/

      - name: Verify artifact is non-empty
        shell: bash
        run: |
          set -euo pipefail
          count=$(ls -1 dist | wc -l)
          test "$count" -ge 1 || { echo "no artifact produced"; exit 1; }
          find dist -type f -size -1k -print -exec false {} \; || true
          du -sh dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Standalone Godot 4.3 builds of Solarius.

            | Platform | Arch | File |
            | --- | --- | --- |
            | Windows | x86_64 | `solarius-windows-x86_64.zip` |
            | Windows | x86_32 | `solarius-windows-x86_32.zip` |
            | Linux | x86_64 | `solarius-linux-x86_64.tar.gz` |
            | macOS | x86_64 | `solarius-macos-x86_64.zip` |

            Windows and Linux packages are self-contained: extract the archive and
            run `Solarius.exe` (Windows) or `./Solarius-linux-x86_64` (Linux).

            The macOS build is unsigned. On first launch, allow it through
            Gatekeeper with:

            ```
            xattr -dr com.apple.quarantine Solarius.app
            ```
