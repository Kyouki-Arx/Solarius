name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: solarius-windows-x86_64
          - os: windows-latest
            artifact: solarius-windows-x86_32
          - os: ubuntu-latest
            artifact: solarius-linux-x86_64
          - os: macos-latest
            artifact: solarius-macos-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        run: python -m pip install scons

      - name: Install Godot 4.3 export templates
        run: |
          curl -sSL -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p templates
          unzip -q templates.tpz -d templates
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv templates/templates "${{ env.APPDATA }}\\Godot\\export_templates\\4.3.stable"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            mkdir -p "$HOME/Library/Application Support/Godot/export_templates"
            mv templates/templates "$HOME/Library/Application Support/Godot/export_templates/4.3.stable"
          else
            mkdir -p "$HOME/.local/share/godot/export_templates"
            mv templates/templates "$HOME/.local/share/godot/export_templates/4.3.stable"
          fi

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          use-mono: false

      - name: Install i686 MinGW (32-bit Windows)
        if: matrix.artifact == 'solarius-windows-x86_32'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-python
            python-pip

      - name: Build 32-bit GDExtension library
        if: matrix.artifact == 'solarius-windows-x86_32'
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm --needed mingw-w64-i686-python-pip
          C:/msys64/mingw32/bin/python -m pip install scons
          cd "$GITHUB_WORKSPACE"
          C:/msys64/mingw32/bin/scons \
            platform=windows target=template_release arch=x86_32 -j4

      - name: Build GDExtension library
        if: matrix.artifact != 'solarius-windows-x86_32'
        run: |
          case "${{ matrix.artifact }}" in
            solarius-windows-x86_64) scons platform=windows target=template_release -j4 ;;
            solarius-linux-x86_64)   scons platform=linux   target=template_release -j4 ;;
            solarius-macos-x86_64)   scons platform=macos   target=template_release -j4 ;;
          esac

      - name: Export standalone build
        run: |
          case "${{ matrix.artifact }}" in
            solarius-windows-x86_64) godot --headless --path . --export-release "Windows Desktop"        build/Solarius.exe ;;
            solarius-windows-x86_32) godot --headless --path . --export-release "Windows Desktop 32-bit" build/Solarius-x86_32.exe ;;
            solarius-linux-x86_64)   godot --headless --path . --export-release "Linux/X11"             build/Solarius.x86_64 ;;
            solarius-macos-x86_64)   godot --headless --path . --export-release "macOS"                 build/Solarius.zip ;;
          esac

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.artifact }}" in
            solarius-windows-x86_64)
              cp build/Solarius.exe build/*.pck dist/ 2>/dev/null || true
              (cd dist && zip -r -9 "${{ matrix.artifact }}.zip" .)
              ;;
            solarius-windows-x86_32)
              cp build/Solarius-x86_32.exe build/*.pck dist/ 2>/dev/null || true
              (cd dist && zip -r -9 "${{ matrix.artifact }}.zip" .)
              ;;
            solarius-linux-x86_64)
              cp build/Solarius.x86_64 build/*.pck dist/ 2>/dev/null || true
              tar -czf dist/"${{ matrix.artifact }}.tar.gz" -C dist Solarius.x86_64 $(cd dist && ls *.pck 2>/dev/null)
              rm -f dist/*.pck dist/Solarius.x86_64
              ;;
            solarius-macos-x86_64)
              cp build/Solarius.zip dist/
              (cd dist && zip -r -9 "${{ matrix.artifact }}-bundle.zip" Solarius.zip)
              ;;
          esac
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Standalone Godot 4.3 builds of Solarius.

            | Platform | Arch | File |
            | --- | --- | --- |
            | Windows | x86_64 | `solarius-windows-x86_64.zip` |
            | Windows | x86_32 | `solarius-windows-x86_32.zip` |
            | Linux | x86_64 | `solarius-linux-x86_64.tar.gz` |
            | macOS | x86_64 | `solarius-macos-x86_64-bundle.zip` |

            Windows packages are self-contained: extract and run `Solarius.exe`.
            The macOS build is unsigned, so on first launch use
            `xattr -dr com.apple.quarantine Solarius.app`.
