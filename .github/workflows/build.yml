name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: solarius-windows-x86_64
            preset: Windows Desktop
            gdext_lib: libaimtrainer.windows.template_release.x86_64.dll
            export_name: Solarius.exe
          - os: windows-latest
            artifact: solarius-windows-x86_32
            preset: Windows Desktop 32-bit
            gdext_lib: libaimtrainer.windows.template_release.x86_32.dll
            export_name: Solarius.exe
          - os: ubuntu-latest
            artifact: solarius-linux-x86_64
            preset: Linux/X11
            gdext_lib: libaimtrainer.linux.template_release.x86_64.so
            export_name: solarius.x86_64
          - os: macos-latest
            artifact: solarius-macos-x86_64
            preset: macOS
            gdext_lib: libaimtrainer.macos.template_release.x86_64.dylib
            export_name: Solarius.zip

    defaults:
      run:
        shell: bash

    env:
      GODOT_VERSION: "4.3"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        shell: bash
        run: python -m pip install scons

      - name: Install Godot 4.3 export templates
        shell: bash
        run: |
          set -euo pipefail
          tdz="$RUNNER_TEMP/godot-templates"
          if [ ! -d "$tdz/templates" ]; then
            curl -fsSL -o "$RUNNER_TEMP/templates.tpz" \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q "$RUNNER_TEMP/templates.tpz" -d "$tdz"
          fi
          python tools/install_templates.py "$tdz" "$GODOT_VERSION"

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          use-mono: false

      - name: Build 32-bit GDExtension library
        if: matrix.artifact == 'solarius-windows-x86_32'
        shell: bash
        run: |
          set -euo pipefail
          # The image's own MinGW is 64-bit only (C:\mingw64), so a 32-bit
          # build needs a real i686 toolchain with its own 32-bit CRT import
          # libraries. msys2's MINGW32 is being phased out and does not land
          # where a later step can find it, so unpack a standalone one instead.
          url="https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-msvcrt-r2/winlibs-i686-posix-dwarf-gcc-16.2.0-mingw-w64msvcrt-14.0.0-r2.zip"
          root="$RUNNER_TEMP/i686"
          if [ ! -x "$root/mingw32/bin/g++.exe" ]; then
            curl -fsSL -o "$RUNNER_TEMP/i686.zip" "$url"
            mkdir -p "$root"
            unzip -q "$RUNNER_TEMP/i686.zip" -d "$root"
          fi
          i686_gxx="$root/mingw32/bin/g++.exe"
          echo "i686 g++: $i686_gxx"
          test -x "$i686_gxx"
          test "$("$i686_gxx" -dumpmachine)" = "i686-w64-mingw32"
          # PATH has to prefer it: on win32 godot-cpp calls mingw.generate(),
          # which re-resolves CC/CXX from PATH and ignores whatever scons' own
          # CC=/CXX= arguments say.
          export PATH="$(cygpath -w "$root/mingw32/bin"):$PATH"
          command -v g++
          test "$(g++ -dumpmachine)" = "i686-w64-mingw32"
          scons platform=windows target=template_release arch=x86_32 use_mingw=yes -j4
          test -f "bin/${{ matrix.gdext_lib }}"

      - name: Build GDExtension library
        if: matrix.artifact != 'solarius-windows-x86_32'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.artifact }}" in
            solarius-windows-x86_64) scons platform=windows target=template_release use_mingw=yes -j4 ;;
            solarius-linux-x86_64)   scons platform=linux   target=template_release arch=x86_64 -j4 ;;
            solarius-macos-x86_64)   scons platform=macos   target=template_release arch=x86_64 -j4 ;;
            *) echo "unknown artifact ${{ matrix.artifact }}"; exit 1 ;;
          esac
          test -f "bin/${{ matrix.gdext_lib }}" || { echo "missing GDExtension library bin/${{ matrix.gdext_lib }}"; exit 1; }

      - name: Build host-arch library for the export editor
        if: matrix.artifact == 'solarius-macos-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          # The export runs a Godot *editor* binary, which reports the host's
          # arch and the `debug` feature, so the manifest's macos.debug.<arch> row
          # has to resolve or the editor aborts before exporting. The host here is
          # Apple Silicon, and scons would otherwise default to `universal`, so
          # build both arches explicitly.
          scons platform=macos target=template_debug arch=arm64 -j4
          scons platform=macos target=template_debug arch=x86_64 -j4
          ls -la bin/

      - name: Export standalone build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-release "${{ matrix.preset }}" \
            "build/${{ matrix.export_name }}"
          ls -la build/

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          python tools/package_build.py \
            "${{ runner.os }}" "${{ matrix.artifact }}" build dist
          ls -la dist/

      - name: Verify artifact is non-empty
        shell: bash
        run: |
          set -euo pipefail
          count=$(ls -1 dist | wc -l)
          test "$count" -ge 1 || { echo "no artifact produced"; exit 1; }
          find dist -type f -size -1k -print -exec false {} \; || true
          du -sh dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Standalone Godot 4.3 builds of Solarius.

            | Platform | Arch | File |
            | --- | --- | --- |
            | Windows | x86_64 | `solarius-windows-x86_64.zip` |
            | Windows | x86_32 | `solarius-windows-x86_32.zip` |
            | Linux | x86_64 | `solarius-linux-x86_64.tar.gz` |
            | macOS | x86_64 | `solarius-macos-x86_64.zip` |

            Windows and Linux packages are self-contained: extract the archive and
            run `Solarius.exe` (Windows) or `./Solarius-linux-x86_64` (Linux).

            The macOS build is unsigned. On first launch, allow it through
            Gatekeeper with:

            ```
            xattr -dr com.apple.quarantine Solarius.app
            ```
